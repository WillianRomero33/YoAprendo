[build]
  command = "ng build --configuration production"
  publish = "www"

# SPA redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================
# HEADERS PARA PREVENIR CACHÉ DE ARCHIVOS PRINCIPALES
# ============================================

# CSS principales - SIN CACHÉ para evitar estilos viejos
[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# JS principales - SIN CACHÉ
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# ============================================
# ASSETS ESTÁTICOS - CON CACHÉ (imágenes, fuentes, etc)
# ============================================

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fuentes (con caché largo)
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Content-Type = "font/woff2"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Content-Type = "font/woff"
    Cache-Control = "public, max-age=31536000, immutable"

# SVG (íconos Ionicons) - CON caché pero con CORS
[[headers]]
  for = "/*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================
# ARCHIVOS CON HASH (Angular genera nombres únicos)
# ============================================

# Si Angular genera archivos con hash (ej: main.5a2b3c4d.js)
# estos tendrán caché largo porque el nombre cambia en cada build
[[headers]]
  for = "/*.[a-f0-9].js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.[a-f0-9].css"
  [headers.values]
    Content-Type = "text/css"
    Cache-Control = "public, max-age=31536000, immutable"