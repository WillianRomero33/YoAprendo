<ion-content class="splash-container">
  <div class="splash-bg">
    <div class="splash-blob blob1"></div>
    <div class="splash-blob blob2"></div>
    <div class="splash-blob blob3"></div>
    <div class="splash-grid"></div>
  </div>
  
  <div class="splash-content">
    <div class="splash-top">
      <div class="uls-tag">
        <ion-text>ImpulNova · ULS · 2026</ion-text>
      </div>
      <div class="splash-title">
        <span class="yo">Yo</span>
        <span class="aprendo">Aprendo</span>
      </div>
      <p class="splash-desc">Tu ecosistema digital para aprender, emprender y crecer — desde tu celular, a tu ritmo.</p>
    </div>
    
    <div class="splash-bottom">
      <ion-button expand="block" class="btn-gold" (click)="goToHome()">
        Comenzar ahora
        <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
      </ion-button>
      <ion-button expand="block" fill="outline" class="btn-ghost" (click)="goToCv()">
        Generar mi CV
      </ion-button>
    </div>
  </div>
</ion-content>
